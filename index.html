<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" id="metaThemeColor">
<title>起始页 · 藏书阁</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%232C5CC5'%3E%3Crect%20x='8'%20y='7'%20width='4.5'%20height='18'%20rx='1.6'%20fill='%23FFFFFF'%3E%3Cpath%20d='M16%209.5h8M16%2014.5h8M16%2019.5h5'%20stroke='%23FFFFFF'%20stroke-width='2'%20stroke-linecap='round'%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body data-bg="none" data-density="comfort">

<!-- ===== 背景层（本地图片，缺失时用渐变兜底） ===== -->
<div class="bg" aria-hidden="true">
  <div class="bg-slot is-on" id="bgA"></div>
  <div class="bg-slot" id="bgB"></div>
  <div class="bg-scrim"></div>
</div>

<a class="skip-link" href="#searchInput">跳到搜索框</a>

<div class="app">

  <div class="topbar-wrap">
    <!-- ===== 极简顶栏 ===== -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">藏书阁</span>
        <span class="brand-sub mono">Personal Research Stacks</span>
      </div>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="themeBtn" aria-label="切换主题" title="切换主题（自动 / 亮 / 暗）"></button>
        <button type="button" class="icon-btn" id="settingsBtn" aria-expanded="false" aria-controls="settings" aria-label="设置" title="设置"></button>
      </div>
    </header>

    <!-- ===== 设置面板：收纳主题 / 背景 / 布局 / 数据 / 安全 ===== -->
    <div class="settings" id="settings" hidden aria-label="设置面板">

      <section class="set-group" aria-labelledby="setLookTitle">
        <h3 class="set-title mono" id="setLookTitle">外观</h3>

        <div class="set-row">
          <span class="set-label">主题</span>
          <div class="seg" id="segTheme" role="radiogroup" aria-label="主题">
            <button type="button" class="seg-btn" role="radio" aria-checked="false" data-v="auto">自动</button>
            <button type="button" class="seg-btn" role="radio" aria-checked="false" data-v="light">亮</button>
            <button type="button" class="seg-btn" role="radio" aria-checked="false" data-v="dark">暗</button>
          </div>
        </div>

        <div class="set-row set-row-block">
          <span class="set-label">背景</span>
          <div class="bg-chips" id="bgChips" role="radiogroup" aria-label="背景图片"></div>
        </div>

        <div class="set-row">
          <label class="set-label" for="brightRange">亮度</label>
          <input type="range" id="brightRange" min="0.3" max="1.4" step="0.05" value="1" aria-label="背景亮度">
          <output class="mono" id="brightOut" for="brightRange">1.00</output>
        </div>

        <div class="set-row">
          <label class="set-label" for="blurRange">模糊</label>
          <input type="range" id="blurRange" min="0" max="20" step="1" value="0" aria-label="背景模糊">
          <output class="mono" id="blurOut" for="blurRange">0px</output>
        </div>
      </section>

      <section class="set-group" aria-labelledby="setLayoutTitle">
        <h3 class="set-title mono" id="setLayoutTitle">布局</h3>

        <div class="set-row">
          <span class="set-label">列数</span>
          <div class="seg" id="segCols" role="radiogroup" aria-label="链接分栏数">
            <button type="button" class="seg-btn" role="radio" aria-checked="false" data-v="1">1</button>
            <button type="button" class="seg-btn" role="radio" aria-checked="false" data-v="2">2</button>
            <button type="button" class="seg-btn" role="radio" aria-checked="false" data-v="3">3</button>
            <button type="button" class="seg-btn" role="radio" aria-checked="false" data-v="4">4</button>
          </div>
        </div>

        <div class="set-row">
          <span class="set-label">密度</span>
          <div class="seg" id="segDensity" role="radiogroup" aria-label="密度">
            <button type="button" class="seg-btn" role="radio" aria-checked="false" data-v="comfort">舒适</button>
            <button type="button" class="seg-btn" role="radio" aria-checked="false" data-v="compact">紧凑</button>
            <button type="button" class="seg-btn" role="radio" aria-checked="false" data-v="minimal">极简</button>
          </div>
        </div>

        <div class="set-row">
          <span class="set-label">全宽</span>
          <label class="switch" for="wideToggle">
            <input type="checkbox" id="wideToggle" class="switch-input">
            <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
            <span class="sr-only">全宽布局</span>
          </label>
        </div>
      </section>

      <section class="set-group" aria-labelledby="setDataTitle">
        <h3 class="set-title mono" id="setDataTitle">数据</h3>

        <div class="set-row">
          <span class="set-label">编辑模式</span>
          <label class="switch" for="editToggle">
            <input type="checkbox" id="editToggle" class="switch-input">
            <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
            <span class="sr-only">编辑模式</span>
          </label>
        </div>

        <div class="set-actions">
          <button type="button" class="mini" id="addCatBtn">＋ 新增分类</button>
          <button type="button" class="mini" id="exportBtn">导出 JSON</button>
          <button type="button" class="mini" id="importOverwriteBtn">导入·覆盖</button>
          <button type="button" class="mini" id="importMergeBtn">导入·合并</button>
          <button type="button" class="mini mini-danger" id="resetBtn">重置为内置默认</button>
        </div>
      </section>

      <section class="set-group" aria-labelledby="setSafeTitle">
        <h3 class="set-title mono" id="setSafeTitle">安全</h3>
        <div class="set-row">
          <span class="set-label">仅看待核实</span>
          <label class="switch" for="safetyToggle">
            <input type="checkbox" id="safetyToggle" class="switch-input">
            <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
            <span class="sr-only">仅看待核实</span>
          </label>
        </div>
      </section>

    </div>
  </div>

  <main>

    <!-- ===== 时钟 ===== -->
    <section class="masthead" aria-label="本地时间">
      <p class="eyebrow mono">Local Time</p>
      <div class="clock" id="clock">
        <span class="clock-hm" id="clockHM">00:00</span><span class="clock-colon" id="clockColon" aria-hidden="true">:</span><span class="clock-s mono" id="clockS">00</span>
      </div>
      <p class="clock-date" id="clockDate">加载中…</p>
    </section>

    <!-- ===== 唯一搜索框 ===== -->
    <section class="search-area" aria-label="搜索">
      <div class="searchbar" id="searchBar">
        <div class="engine" id="enginePicker">
          <button type="button" class="engine-btn" id="engineBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="engineMenu">
            <span class="engine-label" id="engineLabel">Google</span>
            <svg class="engine-caret" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.8 6 7.8l3-3"/></svg>
          </button>
          <div class="engine-menu" id="engineMenu" role="listbox" aria-label="搜索引擎" hidden></div>
        </div>
        <input id="searchInput" type="text" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false"
               aria-label="搜索，或直接输入网址"
               placeholder="搜索，或直接输入网址">
        <button type="button" class="search-go" id="searchGo" aria-label="搜索" title="搜索（回车）"></button>
      </div>
      <p class="hint mono" id="hintLine" hidden></p>
    </section>

    <!-- ===== 常用工具（按点击频率） ===== -->
    <section class="quick" aria-label="常用工具">
      <div class="quick-row" id="quickRow"></div>
    </section>

    <!-- ===== 折叠分类 ===== -->
    <section class="stacks" aria-label="全部站点">
      <h2 class="sr-only">全部站点</h2>
      <p class="stacks-meta">
        <span class="stacks-meta-text mono" id="stacksMeta">全部站点</span>
        <span class="stacks-rule" aria-hidden="true"></span>
      </p>

      <div class="cat-tabs" id="catTabs" role="group" aria-label="分类"></div>

      <div class="cat-panel" id="catPanel"></div>
    </section>

  </main>

  <footer class="footer mono">数据保存在本机浏览器 localStorage · 零外部请求 · 离线可用</footer>
</div>

<!-- ===== 新增 / 编辑链接 ===== -->
<dialog class="dlg" id="linkDialog" aria-labelledby="linkDialogTitle">
  <form method="dialog" id="linkForm" novalidate>
    <h3 class="dlg-title" id="linkDialogTitle">新增链接</h3>

    <div class="field">
      <label for="linkCat">所属分类</label>
      <select id="linkCat"></select>
    </div>

    <div class="field">
      <label for="linkName">站点名称</label>
      <input type="text" id="linkName" maxlength="40" placeholder="例如：百度">
      <p class="field-error" id="linkNameError" hidden></p>
    </div>

    <div class="field">
      <label for="linkUrl">网址</label>
      <input type="text" id="linkUrl" maxlength="300" placeholder="example.com 或 https://example.com">
      <p class="field-error" id="linkUrlError" hidden></p>
    </div>

    <div class="field">
      <label for="linkDesc">一句话描述（可选）</label>
      <input type="text" id="linkDesc" maxlength="60" placeholder="中文搜索首选">
    </div>

    <div class="field">
      <label for="linkSafety">安全状态</label>
      <select id="linkSafety">
        <option value="pending">未核实（pending）</option>
        <option value="safe">安全（safe）</option>
        <option value="caution">谨慎（caution）</option>
      </select>
      <p class="field-hint" id="noteHint">选择「谨慎」时可补充提示文案，悬停安全印鉴即可查看。</p>
    </div>

    <div class="field" id="noteField" hidden>
      <label for="linkNote">谨慎提示文案</label>
      <input type="text" id="linkNote" maxlength="80" placeholder="例如：该站点需要登录才能访问">
    </div>

    <div class="dlg-actions">
      <button type="button" class="mini" data-close="cancel">取消</button>
      <button type="submit" class="mini mini-primary" id="linkSaveBtn" value="save">保存</button>
    </div>
  </form>
</dialog>

<!-- ===== 新增 / 重命名分类 ===== -->
<dialog class="dlg" id="catDialog" aria-labelledby="catDialogTitle">
  <form method="dialog" id="catForm" novalidate>
    <h3 class="dlg-title" id="catDialogTitle">新增分类</h3>

    <div class="field">
      <label for="catName">分类名称</label>
      <input type="text" id="catName" maxlength="20" placeholder="例如：常用工具">
      <p class="field-error" id="catNameError" hidden></p>
    </div>

    <div class="field">
      <label for="catTag">等宽标签（自动大写，可留空）</label>
      <input type="text" id="catTag" maxlength="12" placeholder="TOOLS">
    </div>

    <div class="field">
      <label id="colorLabel">标识色</label>
      <div class="swatches" id="catSwatches" role="radiogroup" aria-labelledby="colorLabel"></div>
      <p class="field-hint">用于分类标签行的圆点标记。</p>
    </div>

    <div class="dlg-actions">
      <button type="button" class="mini" data-close="cancel">取消</button>
      <button type="submit" class="mini mini-primary" id="catSaveBtn" value="save">保存</button>
    </div>
  </form>
</dialog>

<!-- ===== 添加常用链接 ===== -->
<dialog class="dlg dlg-wide" id="pinDialog" aria-labelledby="pinDialogTitle">
  <div class="dlg-block">
    <h3 class="dlg-title" id="pinDialogTitle">添加常用链接</h3>
    <input type="text" id="pinSearch" class="pin-search" placeholder="搜索站点名、分类或描述…" aria-label="搜索站点" autocomplete="off" spellcheck="false">
    <ul class="pin-list" id="pinList"></ul>
    <div class="dlg-actions">
      <button type="button" class="mini" data-close="cancel">关闭</button>
    </div>
  </div>
</dialog>

<!-- ===== 通用二次确认 ===== -->
<dialog class="dlg" id="confirmDialog" aria-labelledby="confirmTitle">
  <form method="dialog">
    <h3 class="dlg-title" id="confirmTitle">确认操作</h3>
    <p class="dlg-body" id="confirmBody"></p>
    <div class="dlg-actions">
      <button type="submit" class="mini" value="cancel">取消</button>
      <button type="submit" class="mini mini-danger" value="ok">确认</button>
    </div>
  </form>
</dialog>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<noscript>
  <p style="max-width:680px;margin:0 auto;padding:24px;font-family:system-ui,sans-serif">
    本页的时钟、搜索与编辑功能需要 JavaScript。请在浏览器设置中启用 JavaScript 后重新打开。
  </p>
</noscript>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
